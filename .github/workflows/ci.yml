name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: `packageManager` in package.json pins pnpm,
      # and setting both makes the action fail on the conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts skips the `prepare` build; the build step below covers it.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run test:coverage

      - run: pnpm run build

      # Proves a consumer installing straight from git gets working entry points.
      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --silent
          # Listed once into a variable: piping tar into `grep -q` makes grep
          # exit early, and the resulting SIGPIPE fails the step under pipefail.
          contents=$(tar -tzf number-flow-native-*.tgz)
          for entry in package/lib/index.js package/lib/index.d.ts package/src/index.ts; do
            if grep -qx "$entry" <<< "$contents"; then
              echo "ok   $entry"
            else
              echo "missing $entry"
              exit 1
            fi
          done
